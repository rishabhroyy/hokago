# hokago — native clients: on every v* tag, build the desktop webview shell
# (macOS/Windows/Linux via Tauri) and the native mobile/TV app (iOS + Android
# phone/TV via Flutter, native/flutter) and attach them to a GitHub release.
# release.yml publishes the server image to GHCR; this workflow is the client
# delivery pipeline.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# → ONE GitHub Release draft "hokago v0.3.0" with every platform artifact.
# The draft is created exactly once by the `release` job — every build job
# depends on it and only uploads assets (tauri-action reuses the existing
# release; gh upload --clobber likewise). Never let two jobs race `gh release
# create` again — that was the split into multiple drafts.
#
# Version plumbing: each job strips the leading "v" off the tag and bakes it
# into the app version (Cargo.toml/tauri.conf.json for Tauri, --build-name/
# --build-number for the Flutter iOS/Android builds). The web app reads its
# own copy back via window.hokagoNative.appVersion and gates on
# MIN_NATIVE_VERSION — the Flutter app reads PackageInfo the same way.

name: native

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  release:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      # gh needs a git repo context to resolve the repository.
      - uses: actions/checkout@v4
      - name: Create the one draft release (adopt or create — never duplicate)
        run: |
          # Re-pushing a tag re-triggers this workflow, and a blind
          # `gh release create` on every run splits uploads across duplicate
          # drafts (v0.3.2 lost its iOS assets exactly this way). Resolve
          # first: adopt an existing release for the tag (every upload uses
          # --clobber, so it lands there fine), then drop stale duplicate
          # drafts, and create only when nothing exists.
          set -euo pipefail
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "release for $TAG already exists — adopting it; not creating a duplicate"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == true and .tag_name == env.TAG) | .id' | while read -r id; do
            echo "deleting stale duplicate draft $id for $TAG"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          printf '%s\n' '## Install notes' '' '**macOS (Apple Silicon)** — the app is ad-hoc signed, not notarized. If macOS says it is "damaged and can'"'"'t be opened", it is the Gatekeeper quarantine attribute:' '```' 'xattr -cr /Applications/hokago.app' '```' 'Prefer the .dmg over the raw .app.tar.gz.' '' '**Windows** — unsigned build: SmartScreen → "More info" → "Run anyway".' '' '**iOS** — install the .ipa with Sideloadly/AltStore (re-signs with your Apple ID). The simulator zip is for development only.' '' '**Android** — the APKs are self-signed with the repo'"'"'s committed key (stable signature across releases, so upgrades install cleanly). "Install unknown apps" permission is required on first install. The TV APK targets Android TV.' |
            gh release create "$TAG" --draft --title "hokago $TAG" --notes-file -
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.versions.outputs.tag }}

  tauri-macos:
    needs: [versions, release]
    runs-on: macos-14
    env:
      APP_VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build web SPA (offline bundle)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @hokago/db generate
          pnpm --filter @hokago/contract generate
          pnpm --filter @hokago/fonts build
          pnpm -r build
          rm -rf native/tauri/web-dist
          mkdir -p native/tauri/web-dist
          cp -R apps/web/dist/. native/tauri/web-dist/
      - name: Install Tauri CLI
        working-directory: native/tauri
        run: npm install --no-package-lock --no-save
      - name: Generate platform icons
        working-directory: native/tauri
        run: ./node_modules/.bin/tauri icon src-tauri/icons/icon.png
      - name: Bake version
        run: |
          sed -i '' "s/^version = .*/version = \"${APP_VERSION}\"/" native/tauri/src-tauri/Cargo.toml
          sed -i '' "s/\"version\": \".*\"/\"version\": \"${APP_VERSION}\"/" native/tauri/src-tauri/tauri.conf.json
          sed -i '' "s/\"version\": \".*\"/\"version\": \"${APP_VERSION}\"/" native/tauri/package.json
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: native/tauri
          tauriScript: pnpm tauri
          tagName: ${{ needs.versions.outputs.tag }}
          releaseName: "hokago ${{ needs.versions.outputs.tag }}"
          releaseDraft: true
          args: --target aarch64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tauri-windows:
    needs: [versions, release]
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build web SPA (offline bundle)
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @hokago/db generate
          pnpm --filter @hokago/contract generate
          pnpm --filter @hokago/fonts build
          pnpm -r build
          rm -rf native/tauri/web-dist
          mkdir -p native/tauri/web-dist
          cp -R apps/web/dist/. native/tauri/web-dist/
      - name: Install Tauri CLI
        working-directory: native/tauri
        run: npm install --no-package-lock --no-save
      - name: Generate platform icons
        working-directory: native/tauri
        run: ./node_modules/.bin/tauri icon src-tauri/icons/icon.png
      - name: Bake version
        shell: bash
        run: |
          sed -i "s/^version = .*/version = \"${APP_VERSION}\"/" native/tauri/src-tauri/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"${APP_VERSION}\"/" native/tauri/src-tauri/tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"${APP_VERSION}\"/" native/tauri/package.json
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: native/tauri
          tauriScript: pnpm tauri
          tagName: ${{ needs.versions.outputs.tag }}
          releaseName: "hokago ${{ needs.versions.outputs.tag }}"
          releaseDraft: true
          args: --target x86_64-pc-windows-msvc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tauri-linux:
    needs: [versions, release]
    runs-on: ubuntu-22.04
    env:
      APP_VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build web SPA (offline bundle)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @hokago/db generate
          pnpm --filter @hokago/contract generate
          pnpm --filter @hokago/fonts build
          pnpm -r build
          rm -rf native/tauri/web-dist
          mkdir -p native/tauri/web-dist
          cp -R apps/web/dist/. native/tauri/web-dist/
      - name: Install Tauri CLI
        working-directory: native/tauri
        run: npm install --no-package-lock --no-save
      - name: Generate platform icons
        working-directory: native/tauri
        run: ./node_modules/.bin/tauri icon src-tauri/icons/icon.png
      - name: Bake version
        run: |
          sed -i "s/^version = .*/version = \"${APP_VERSION}\"/" native/tauri/src-tauri/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"${APP_VERSION}\"/" native/tauri/src-tauri/tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"${APP_VERSION}\"/" native/tauri/package.json
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: native/tauri
          tauriScript: pnpm tauri
          tagName: ${{ needs.versions.outputs.tag }}
          releaseName: "hokago ${{ needs.versions.outputs.tag }}"
          releaseDraft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    needs: [versions, release]
    runs-on: macos-14
    env:
      APP_VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: native/flutter
        run: flutter pub get
      - name: Build simulator app
        working-directory: native/flutter
        run: |
          # `flutter build ios --release --simulator` hard-errors — Flutter
          # only supports --debug for simulator builds. The device build
          # below stays --release.
          flutter build ios --debug --simulator \
            --build-name="$APP_VERSION" --build-number="${{ github.run_number }}"
          ditto -ck --rsrc --sequesterRsrc build/ios/iphonesimulator/Runner.app \
            "hokago-${APP_VERSION}-ios-simulator.zip"
      - name: Build device app (unsigned — Sideloadly re-signs with your Apple ID)
        working-directory: native/flutter
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$APP_VERSION" --build-number="${{ github.run_number }}"
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "hokago-${APP_VERSION}-ios-sideload.ipa" Payload
          rm -rf Payload
      - name: Upload simulator app + sideload IPA
        working-directory: native/flutter
        run: |
          gh release upload "$TAG" \
            "hokago-${APP_VERSION}-ios-simulator.zip" \
            "hokago-${APP_VERSION}-ios-sideload.ipa" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.versions.outputs.tag }}

  android:
    needs: [versions, release]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare release keystore
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Repo secrets are not configured. Set ANDROID_KEYSTORE_BASE64 (base64 of the .keystore file), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD — see docs/native-clients.md § Android signing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > native/flutter/android/app/ci-release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Install dependencies
        working-directory: native/flutter
        run: flutter pub get
      - name: Build APKs
        working-directory: native/flutter
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/native/flutter/android/app/ci-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # run_number is monotonic per-repo — a stable, ever-increasing
          # versionCode so upgrades always install over older builds.
          flutter build apk --release --flavor phone \
            --build-name="$APP_VERSION" --build-number="${{ github.run_number }}"
          flutter build apk --release --flavor tv \
            --build-name="$APP_VERSION" --build-number="${{ github.run_number }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-phone-release.apk "dist/hokago-${APP_VERSION}-android-phone.apk"
          cp build/app/outputs/flutter-apk/app-tv-release.apk "dist/hokago-${APP_VERSION}-android-tv.apk"
      - name: Upload APKs
        shell: bash
        run: |
          gh release upload "$TAG" \
            dist/hokago-${APP_VERSION}-android-phone.apk \
            dist/hokago-${APP_VERSION}-android-tv.apk \
            --clobber
        working-directory: native/flutter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.versions.outputs.tag }}
