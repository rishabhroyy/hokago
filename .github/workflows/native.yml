# hokago — native clients: on every v* tag, build the webview shells
# (macOS/Windows/Linux via Tauri, iOS via XcodeGen, Android phone+TV via
# Gradle) and attach them to a GitHub release. release.yml publishes the
# server image to GHCR; this workflow is the client delivery pipeline.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# → ONE GitHub Release draft "hokago v0.3.0" with every platform artifact.
# The draft is created exactly once by the `release` job — every build job
# depends on it and only uploads assets (tauri-action reuses the existing
# release; gh upload --clobber likewise). Never let two jobs race `gh release
# create` again — that was the split into multiple drafts.
#
# Version plumbing: each job strips the leading "v" off the tag and bakes it
# into the app version (Cargo.toml/tauri.conf.json for Tauri, project.yml for
# XcodeGen, -PappVersion* for Gradle). The web app reads it back via
# window.hokagoNative.appVersion and gates on MIN_NATIVE_VERSION.

name: native

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  release:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: Create the one draft release
        run: >
          printf '%s\n'
          '## Install notes' ''
          '**macOS (Apple Silicon)** — the app is ad-hoc signed, not notarized. If macOS says it is "damaged and can'"'"'t be opened", it is the Gatekeeper quarantine attribute:'
          '```' 'xattr -cr /Applications/hokago.app' '```'
          'Prefer the .dmg over the raw .app.tar.gz.' ''
          '**Windows** — unsigned build: SmartScreen → "More info" → "Run anyway".' ''
          '**iOS** — install the .ipa with Sideloadly/AltStore (re-signs with your Apple ID). The simulator zip is for development only.' ''
          '**Android** — the APKs are self-signed with the repo'"'"'s committed key (stable signature across releases, so upgrades install cleanly). "Install unknown apps" permission is required on first install. The TV APK targets Android TV.'
          | gh release create "$TAG" --draft --title "hokago $TAG" --notes-file -
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.versions.outputs.tag }}

  tauri-macos:
    needs: [versions, release]
    runs-on: macos-14
    env:
      APP_VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Build web SPA (offline bundle)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @hokago/db generate
          pnpm --filter @hokago/contract generate
          pnpm --filter @hokago/fonts build
          pnpm -r build
          rm -rf native/tauri/web-dist
          mkdir -p native/tauri/web-dist
          cp -R apps/web/dist/. native/tauri/web-dist/
      - name: Install Tauri CLI
        working-directory: native/tauri
        run: npm install --no-package-lock --no-save
      - name: Generate platform icons
        working-directory: native/tauri
        run: ./node_modules/.bin/tauri icon src-tauri/icons/icon.png
      - name: Bake version
        run: |
          sed -i '' "s/^version = .*/version = \"${APP_VERSION}\"/" native/tauri/src-tauri/Cargo.toml
          sed -i '' "s/\"version\": \".*\"/\"version\": \"${APP_VERSION}\"/" native/tauri/src-tauri/tauri.conf.json
          sed -i '' "s/\"version\": \".*\"/\"version\": \"${APP_VERSION}\"/" native/tauri/package.json
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: native/tauri
          tauriScript: pnpm tauri
          tagName: ${{ needs.versions.outputs.tag }}
          releaseName: "hokago ${{ needs.versions.outputs.tag }}"
          releaseDraft: true
          args: --target aarch64-apple-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tauri-windows:
    needs: [versions, release]
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build web SPA (offline bundle)
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @hokago/db generate
          pnpm --filter @hokago/contract generate
          pnpm --filter @hokago/fonts build
          pnpm -r build
          rm -rf native/tauri/web-dist
          mkdir -p native/tauri/web-dist
          cp -R apps/web/dist/. native/tauri/web-dist/
      - name: Install Tauri CLI
        working-directory: native/tauri
        run: npm install --no-package-lock --no-save
      - name: Generate platform icons
        working-directory: native/tauri
        run: ./node_modules/.bin/tauri icon src-tauri/icons/icon.png
      - name: Bake version
        shell: bash
        run: |
          sed -i "s/^version = .*/version = \"${APP_VERSION}\"/" native/tauri/src-tauri/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"${APP_VERSION}\"/" native/tauri/src-tauri/tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"${APP_VERSION}\"/" native/tauri/package.json
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: native/tauri
          tauriScript: pnpm tauri
          tagName: ${{ needs.versions.outputs.tag }}
          releaseName: "hokago ${{ needs.versions.outputs.tag }}"
          releaseDraft: true
          args: --target x86_64-pc-windows-msvc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tauri-linux:
    needs: [versions, release]
    runs-on: ubuntu-22.04
    env:
      APP_VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build web SPA (offline bundle)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @hokago/db generate
          pnpm --filter @hokago/contract generate
          pnpm --filter @hokago/fonts build
          pnpm -r build
          rm -rf native/tauri/web-dist
          mkdir -p native/tauri/web-dist
          cp -R apps/web/dist/. native/tauri/web-dist/
      - name: Install Tauri CLI
        working-directory: native/tauri
        run: npm install --no-package-lock --no-save
      - name: Generate platform icons
        working-directory: native/tauri
        run: ./node_modules/.bin/tauri icon src-tauri/icons/icon.png
      - name: Bake version
        run: |
          sed -i "s/^version = .*/version = \"${APP_VERSION}\"/" native/tauri/src-tauri/Cargo.toml
          sed -i "s/\"version\": \".*\"/\"version\": \"${APP_VERSION}\"/" native/tauri/src-tauri/tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"${APP_VERSION}\"/" native/tauri/package.json
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: native/tauri
          tauriScript: pnpm tauri
          tagName: ${{ needs.versions.outputs.tag }}
          releaseName: "hokago ${{ needs.versions.outputs.tag }}"
          releaseDraft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    needs: [versions, release]
    runs-on: macos-14
    env:
      APP_VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build web SPA (offline bundle)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @hokago/db generate
          pnpm --filter @hokago/contract generate
          pnpm --filter @hokago/fonts build
          pnpm -r build
          rm -rf native/ios/web-dist
          mkdir -p native/ios/web-dist
          cp -R apps/web/dist/. native/ios/web-dist/
      - name: Bake version
        run: |
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"${APP_VERSION}\"/" native/ios/project.yml
      - name: Generate project
        working-directory: native/ios
        run: xcodegen generate
      - name: Build simulator app
        working-directory: native/ios
        run: |
          xcodebuild -project hokago.xcodeproj -scheme hokago -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          ditto -ck --rsrc --sequesterRsrc build/Build/Products/Release-iphonesimulator/hokago.app \
            "hokago-${APP_VERSION}-ios-simulator.zip"
      - name: Build device IPA (unsigned — Sideloadly re-signs with your Apple ID)
        working-directory: native/ios
        run: |
          xcodebuild -project hokago.xcodeproj -scheme hokago -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/hokago.app Payload/
          zip -qr "hokago-${APP_VERSION}-ios-sideload.ipa" Payload
          rm -rf Payload
      - name: Upload simulator app + sideload IPA
        working-directory: native/ios
        run: |
          gh release upload "$TAG" \
            "hokago-${APP_VERSION}-ios-simulator.zip" \
            "hokago-${APP_VERSION}-ios-sideload.ipa" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.versions.outputs.tag }}

  android:
    needs: [versions, release]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Build web SPA (offline bundle)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @hokago/db generate
          pnpm --filter @hokago/contract generate
          pnpm --filter @hokago/fonts build
          pnpm -r build
          rm -rf native/android/app/src/main/assets/web-dist
          mkdir -p native/android/app/src/main/assets/web-dist
          cp -R apps/web/dist/. native/android/app/src/main/assets/web-dist/
      - name: Build APKs
        working-directory: native/android
        run: |
          # run_number is monotonic per-repo — a stable, ever-increasing
          # versionCode so upgrades always install over older builds.
          gradle -PappVersionName="$APP_VERSION" -PappVersionCode="${{ github.run_number }}" assemblePhoneRelease assembleTvRelease
      - name: Upload APKs
        shell: bash
        run: |
          ls -la app/build/outputs/apk/phone/release/ app/build/outputs/apk/tv/release/
          gh release upload "$TAG" \
            app/build/outputs/apk/phone/release/*.apk \
            app/build/outputs/apk/tv/release/*.apk \
            --clobber
        working-directory: native/android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.versions.outputs.tag }}
