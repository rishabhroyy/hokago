# hokago — release: on every v* tag, build the image for amd64 + arm64 on
# native runners and publish to GHCR.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# → ghcr.io/<repo>/hokago:v0.1.0 (multi-arch manifest) + :latest
#
# Architecture split: amd64 compiles ffmpeg with hwaccel support (vaapi/qsv/
# nvenc — the Dockerfile gates those on TARGETARCH), arm64 is CPU-only, and
# the runtime falls back to CPU when no device is mounted. Native arm64
# runners (no QEMU) keep the double ffmpeg source build in the 10-20min range;
# gha layer caching (mode=max, per-arch scopes) makes repeat releases cheap —
# the ffmpeg compile layers are only restored when the codec versions change.
# The per-arch tags stay published (immich-style); the manifest merge job
# assembles the version + latest tags from them.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.arch }}
          build-args: HOKAGO_VERSION=${{ github.ref_name }}
          # Per-arch cache scopes: two parallel builds must never race the
          # same gha cache entry. mode=max is required — min only caches
          # final-image layers and the ffmpeg compile layers live in an
          # intermediate stage that's only COPY'd from.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

  manifest:
    name: merge multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            --tag ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-amd64 \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-arm64