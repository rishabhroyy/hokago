<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hokago — admin</title>
<style>
  :root {
    --paper: #F5EFE4;
    --ink: #35302B;
    --ink-2: #8B8177;
    --ink-3: #B4ABA0;
    --line: #E6DDCE;
    --wii: #4FB8E0;
    --wii-2: #8FE0F5;
    --wii-deep: #2E9BC4;
    --accent: #E8664F;
    --gold: #E3A34C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    background-color: var(--paper);
    background-image:
      radial-gradient(130% 75% at 50% -10%, rgba(255, 248, 233, 0.95), transparent 55%),
      radial-gradient(46% 38% at 94% -6%, rgba(79, 184, 224, 0.16), transparent 70%),
      radial-gradient(40% 34% at -4% 22%, rgba(240, 131, 111, 0.09), transparent 70%),
      radial-gradient(rgba(120, 95, 72, 0.06) 1.2px, transparent 1.7px);
    background-size: 100% 100%, 100% 100%, 100% 100%, 26px 26px;
    background-repeat: no-repeat, no-repeat, no-repeat, repeat;
    background-attachment: fixed;
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 32px 80px; }

  header { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
  .mark {
    width: 46px; height: 46px; border-radius: 15px;
    background: linear-gradient(160deg, var(--wii-2), var(--wii-deep));
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.5), 0 6px 16px -6px rgba(46,155,196,.6);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 20px;
  }
  h1 { font-size: 26px; margin: 0; letter-spacing: .01em; }
  .sub { font-size: 12px; color: var(--ink-3); font-family: ui-monospace, "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .14em; margin-top: 3px; }
  .live {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 700; color: var(--ink-2);
    font-family: ui-monospace, "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .12em;
  }
  .live::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--wii); box-shadow: 0 0 8px rgba(79,184,224,.9);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .queue {
    background: rgba(255,255,255,.86);
    border: 1px solid rgba(255,255,255,.95);
    border-radius: 24px;
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.9), 0 2px 6px -2px rgba(120,80,60,.14), 0 18px 44px -18px rgba(120,80,60,.35);
    backdrop-filter: blur(10px);
    padding: 26px 28px;
    margin-bottom: 22px;
  }
  .q-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .q-head h2 { margin: 0; font-size: 19px; letter-spacing: .01em; }
  .q-head h2::before {
    content: ""; display: inline-block; width: 6px; height: 18px; border-radius: 99px;
    background: linear-gradient(180deg, var(--wii-2), var(--wii-deep));
    box-shadow: 0 0 8px rgba(79,184,224,.6);
    margin-right: 11px; vertical-align: -3px;
  }
  .pill {
    font-family: ui-monospace, "JetBrains Mono", monospace;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
    padding: 4px 10px; border-radius: 99px;
  }
  .pill.ok { background: rgba(79,184,224,.14); color: var(--wii-deep); }
  .pill.paused { background: rgba(227,163,76,.18); color: #B27A22; }

  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .stat {
    min-width: 96px; padding: 12px 16px; border-radius: 16px;
    background: #FBF8F1; border: 1px solid var(--line);
    box-shadow: inset 0 1.5px 3px rgba(120,80,60,.06);
  }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span {
    font-family: ui-monospace, "JetBrains Mono", monospace;
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3);
  }
  .stat.hot b { color: var(--accent); }
  .stat.active b { color: var(--wii-deep); }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
    border-radius: 99px; padding: 9px 18px;
    color: var(--ink); background: rgba(255,255,255,.9); border: 1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 2px 6px -3px rgba(120,80,60,.25);
    transition: transform .15s cubic-bezier(.4,1.4,.5,1), box-shadow .2s, color .15s, border-color .15s;
  }
  button:hover { transform: translateY(-1.5px); color: var(--wii-deep); border-color: var(--wii); box-shadow: 0 0 0 3px rgba(79,184,224,.25); }
  button:active { transform: scale(.95); }
  button.primary {
    background: linear-gradient(180deg, #6FC9EA, var(--wii-deep)); color: #fff; border-color: transparent;
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), 0 6px 18px -6px rgba(46,155,196,.65);
    text-shadow: 0 1px 2px rgba(23,122,158,.4);
  }
  button.primary:hover { box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), 0 4px 24px -2px rgba(79,184,224,.8), 0 0 0 3px rgba(255,255,255,.9), 0 0 0 5px rgba(79,184,224,.5); color: #fff; }

  pre {
    background: #2B2620; color: #F0E9DC;
    padding: 16px 18px; border-radius: 16px; overflow-x: auto;
    font-size: 12px; line-height: 1.6; margin: 16px 0 0;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.35);
  }
  .empty { text-align: center; color: var(--ink-2); font-size: 14px; padding: 60px 0; }
  .denied { max-width: 420px; margin: 12vh auto 0; text-align: center; }
  .denied .mark { margin: 0 auto 20px; width: 64px; height: 64px; border-radius: 20px; font-size: 28px; }
  .denied h2 { font-size: 22px; margin: 0 0 8px; }
  .denied p { color: var(--ink-2); font-size: 13.5px; margin: 0 0 22px; }
  .denied a {
    display: inline-block; text-decoration: none; border-radius: 99px; padding: 12px 26px;
    font-size: 13.5px; font-weight: 700; color: #fff;
    background: linear-gradient(180deg, #6FC9EA, var(--wii-deep));
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), 0 6px 18px -6px rgba(46,155,196,.65);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">h</div>
    <div>
      <h1>hokago admin</h1>
      <div class="sub">job queues</div>
    </div>
    <div class="live">live · 5s</div>
  </header>
  <div id="queues"><div class="empty">loading queues…</div></div>
</div>

<script>
function token() { return localStorage.getItem("hokago_access_token"); }

let timer = null;

async function api(path, opts) {
  const res = await fetch(path, {
    ...opts,
    headers: { "content-type": "application/json", authorization: `Bearer ${token() ?? ""}` },
  });
  if (res.status === 401 || res.status === 403) {
    const err = new Error("forbidden");
    err.status = res.status;
    throw err;
  }
  return res.json();
}

function showDenied() {
  clearInterval(timer);
  document.getElementById("queues").innerHTML = `
    <div class="queue denied">
      <div class="mark">h</div>
      <h2>admins only</h2>
      <p>${token() ? "this account doesn't have admin access." : "you need to sign in with an admin account first."}</p>
      <a href="/">back to hokago</a>
    </div>`;
  document.querySelector(".live").style.display = "none";
}

const HOT = new Set(["failed", "dead"]);
const ACTIVE = new Set(["active", "waiting", "delayed"]);

async function render() {
  let queues;
  try {
    queues = await api("/admin/queues");
  } catch {
    showDenied();
    return;
  }
  const root = document.getElementById("queues");
  if (!queues.length) {
    root.innerHTML = `<div class="queue empty">no queues yet — they'll appear once the worker boots.</div>`;
    return;
  }
  root.innerHTML = "";
  for (const q of queues) {
    const section = document.createElement("div");
    section.className = "queue";
    section.innerHTML = `
      <div class="q-head">
        <h2>${q.name}</h2>
        <span class="pill ${q.paused ? "paused" : "ok"}">${q.paused ? "paused" : "running"}</span>
      </div>
      <div class="stats">
        ${Object.entries(q.counts).map(([k, v]) => `
          <div class="stat ${HOT.has(k) && v > 0 ? "hot" : ACTIVE.has(k) && v > 0 ? "active" : ""}">
            <b>${v}</b><span>${k}</span>
          </div>`).join("")}
      </div>
      <div class="actions">
        <button class="primary" data-act="${q.paused ? "resume" : "pause"}" data-q="${q.name}">${q.paused ? "Resume" : "Pause"}</button>
        <button data-act="retry-failed" data-q="${q.name}">Retry failed</button>
        <button data-act="clean" data-q="${q.name}">Clean completed</button>
        <button data-act="jobs" data-q="${q.name}">Show failed jobs</button>
      </div>
      <pre id="jobs-${q.name}" style="display:none"></pre>
    `;
    root.appendChild(section);
  }

  root.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const q = btn.dataset.q;
      const act = btn.dataset.act;
      if (act === "jobs") {
        let jobs;
        try {
          jobs = await api(`/admin/queues/${q}/jobs?state=failed`);
        } catch {
          showDenied();
          return;
        }
        const pre = document.getElementById(`jobs-${q}`);
        pre.style.display = pre.style.display === "none" ? "block" : "none";
        pre.textContent = JSON.stringify(jobs, null, 2);
        return;
      }
      try {
        await api(`/admin/queues/${q}/${act}`, { method: "POST" });
      } catch {
        showDenied();
        return;
      }
      render();
    });
  });
}

render();
timer = setInterval(render, 5000);
</script>
</body>
</html>
