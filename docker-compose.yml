# hokago — deployment compose template (drop-in).
#
# Pulls the published image from GHCR, Immich-style. No build blocks here —
# local/self-built images use the compose.build.yml overlay:
#   docker compose -f docker-compose.yml -f compose.build.yml up -d --build
#
# Configuration: every value below is an inline ${VAR:-default} — edit this
# file directly to customize. A `.env` next to the file optionally overrides
# any of them (compose standard), but nothing requires one:
#   - HOKAGO_CONFIG_DIR     host dir for /config (db, artwork, fonts, cache)
#   - MEDIA_MOVIES_PATH/TV_PATH/ANIME_PATH   host dirs mounted read-only into
#     the fixed container paths /media/movies, /media/tv, /media/anime —
#     the setup wizard records those container-side paths as library roots.
#     Want more libraries? Add a mount line like the three below and enter
#     the matching target path in the wizard.
#   - HOKAGO_PORT           published HTTP port (default 3000)
#   - HOKAGO_VERSION        image tag to run (default latest)
#   - HOKAGO_JWT_SECRET     optional — the API auto-generates and persists a
#     random signing secret on first boot (env only overrides it)
#   - PUID/PGID             declared for future file-permission work; not
#     enforced yet (build-order wizard step) — bind mounts are owned by the
#     UID that created them
#
# Hardware acceleration = one extra -f overlay, no rebuild:
#   Intel/AMD (VAAPI/QSV): infra/hwaccel.transcoding.yml
#   NVIDIA (NVENC):        infra/hwaccel.nvenc.yml  (needs nvidia-container-toolkit)
#
# Bind mounts only. No named docker volumes anywhere, including Postgres —
# except Postgres's own internal UID (see the postgres service below).

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: hokago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hokago}
      POSTGRES_DB: hokago
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Published for pg_dump/migrations from the host (backup story).
      # Not required by any container — safe to remove for a locked-down deploy.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Bind mount, not a named volume. No `user:` override here —
      # the stock postgres image runs internally as its own fixed UID
      # (typically 999) and chowns this path itself on first boot. Fighting
      # that with PUID/PGID recreates the exact permission hell those
      # variables exist to prevent (documented deliberate exception).
      - ${HOKAGO_CONFIG_DIR:-./data/config}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hokago"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-bookworm
    restart: unless-stopped
    ports:
      # Published for local dev (running apps/worker or apps/api directly on
      # the host, outside compose). Not required by any container — safe to
      # remove for a locked-down deploy, same rationale as postgres above.
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - ${HOKAGO_CONFIG_DIR:-./data/config}/cache/valkey:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  hokago:
    image: ghcr.io/rishabhroyy/hokago:${HOKAGO_VERSION:-latest}
    # Migrations before boot — a fresh postgres has no tables and the API
    # would crash into a restart loop. prisma migrate deploy is idempotent.
    # First, snapshot the pre-migration DB to /config/db-backups/ so every
    # migration is reversible in-place (rotated: 14 days kept); a fresh DB
    # dumps to an empty file that's deleted. `exec` replaces sh so SIGTERM
    # reaches node directly (graceful shutdown kills ffmpeg children and
    # closes WS sessions).
    command: ["sh", "-c", "mkdir -p /config/db-backups && f=/config/db-backups/pre-migrate-$(date +%Y%m%d-%H%M%S).sql.gz && pg_dump --no-owner \"postgresql://hokago:${POSTGRES_PASSWORD:-hokago}@postgres:5432/hokago\" | gzip > \"$$f\"; [ \"$$(wc -c < \"$$f\")\" -gt 100 ] || rm -f \"$$f\"; find /config/db-backups -name 'pre-migrate-*.sql.gz' -mtime +14 -delete; pnpm --filter @hokago/db run migrate:deploy && exec node apps/api/dist/index.js"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hokago:${POSTGRES_PASSWORD:-hokago}@postgres:5432/hokago
      VALKEY_URL: redis://valkey:6379
      # The bind mount below is the config dir. Code defaults to ./data/config
      # (cwd-relative) — without this the API reads/writes an empty overlay
      # dir inside the container and every artwork/avatar/font 404s.
      HOKAGO_CONFIG_DIR: /config
      # The SPA ships inside this image (infra/docker/Dockerfile runtime
      # stage) — when set, the API serves it and COOP/COEP become same-origin.
      HOKAGO_WEB_ROOT: /app/web
      PORT: 3000
      # Optional override: leave unset and the API auto-generates a random
      # signing secret on first boot and persists it (server_settings).
      # Pin it here only for multi-replica setups that must sign identically.
      HOKAGO_JWT_SECRET: ${HOKAGO_JWT_SECRET:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    ports:
      - "${HOKAGO_PORT:-3000}:3000"
    healthcheck:
      # /health answers only after migrations + listen complete; node:22 has
      # a global fetch, so no curl dependency is needed in the runtime image.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ${HOKAGO_CONFIG_DIR:-./data/config}:/config
      # Media roots are first-class and plural — one line per Library, bound
      # at the fixed container path the Library's rootPath records (both API
      # and worker read media files). Sources are env-driven: point each at
      # your host folders in .env, or accept the ./data/media/* defaults.
      - ${MEDIA_MOVIES_PATH:-./data/media/movies}:/media/movies:ro
      - ${MEDIA_TV_PATH:-./data/media/tv}:/media/tv:ro
      - ${MEDIA_ANIME_PATH:-./data/media/anime}:/media/anime:ro

  hokago-worker:
    image: ghcr.io/rishabhroyy/hokago:${HOKAGO_VERSION:-latest}
    command: ["sh", "-c", "exec node apps/worker/dist/index.js"]
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # The API runs migrations on boot — start after it so the worker's
      # boot reconciler never queries a schema that doesn't exist yet.
      hokago:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hokago:${POSTGRES_PASSWORD:-hokago}@postgres:5432/hokago
      VALKEY_URL: redis://valkey:6379
      # Same as the API: artwork/fonts are written here and must land in the
      # shared bind mount, not the container overlay.
      HOKAGO_CONFIG_DIR: /config
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ${HOKAGO_CONFIG_DIR:-./data/config}:/config
      - ${MEDIA_MOVIES_PATH:-./data/media/movies}:/media/movies:ro
      - ${MEDIA_TV_PATH:-./data/media/tv}:/media/tv:ro
      - ${MEDIA_ANIME_PATH:-./data/media/anime}:/media/anime:ro