# hokago — deployment compose template (drop-in).
#
# Pulls the published image from GHCR, Immich-style. No build blocks here —
# local/self-built images use the compose.build.yml overlay:
#   docker compose -f docker-compose.yml -f compose.build.yml up -d --build
#
# Configuration lives in `.env` (this file loads it via `env_file` and uses
# its values everywhere, so it is REQUIRED — docker compose refuses to start
# without it). Copy `example.env` to `.env` and edit the plain KEY=value
# lines there — no yaml knowledge needed. What each value means:
#   - MEDIA_MOVIES_PATH/TV_PATH/ANIME_PATH   host dirs mounted read-only into
#     the fixed container paths /media/movies, /media/tv, /media/anime —
#     the setup wizard records those container-side paths as library roots.
#     Want more libraries? Add a mount line like the three below and enter
#     the matching target path in the wizard.
#   - HOKAGO_CONFIG_DIR     host dir for /config (db, artwork, fonts, cache)
#   - POSTGRES_PASSWORD     local postgres password (not published by default)
#   - HOKAGO_PORT           published HTTP port (default 3000)
#   - HOKAGO_VERSION        image tag to run (default latest)
#   - everything else is optional — see the comments in example.env
#
# Hardware acceleration: AMD/Intel GPUs work out of the box — /dev/dri is
# mounted unconditionally below, the image ships the drivers, and boot-time
# auto-detection (HOKAGO_HWACCEL=auto) picks the best method; a host with no
# GPU just sees an empty /dev/dri and falls back to CPU. NVIDIA (NVENC) needs
# nvidia-container-toolkit on the host — uncomment the `gpus: all` line on
# both services below; nothing else.
#
# Bind mounts only. No named docker volumes anywhere, including Postgres —
# except Postgres's own internal UID (see the postgres service below).

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: hokago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hokago
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Published for pg_dump/migrations from the host (backup story).
      # Not required by any container — safe to remove for a locked-down deploy.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Bind mount, not a named volume. No `user:` override here —
      # the stock postgres image runs internally as its own fixed UID
      # (typically 999) and chowns this path itself on first boot. Fighting
      # that with PUID/PGID recreates the exact permission hell those
      # variables exist to prevent (documented deliberate exception).
      - ${HOKAGO_CONFIG_DIR}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hokago"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-bookworm
    restart: unless-stopped
    # AOF on top of the RDB snapshot: the queue state (BullMQ jobs) lives
    # here, and while the bind mount below survives container restarts and
    # re-pulls, only append-mode covers a hard kill or power loss between
    # RDB snapshots. The worker's boot reconciler re-derives any lost work
    # from Postgres regardless — this just avoids the re-derivation wave.
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      # Published for local dev (running apps/worker or apps/api directly on
      # the host, outside compose). Not required by any container — safe to
      # remove for a locked-down deploy, same rationale as postgres above.
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - ${HOKAGO_CONFIG_DIR}/cache/valkey:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  hokago:
    image: ghcr.io/rishabhroyy/hokago:${HOKAGO_VERSION:-latest}
    # Every HOKAGO_*/MEDIA_*/PUID/PGID/TZ value comes from here — the app
    # services need the same .env the rest of this file interpolates from.
    # Missing .env = hard error, so the first thing a host does is
    # `cp example.env .env`.
    env_file:
      - .env
    # Migrations before boot — a fresh postgres has no tables and the API
    # would crash into a restart loop. prisma migrate deploy is idempotent.
    # First, snapshot the pre-migration DB to /config/db-backups/ so every
    # migration is reversible in-place (rotated: 14 days kept); a fresh DB
    # dumps to an empty file that's deleted. `exec` replaces sh so SIGTERM
    # reaches node directly (graceful shutdown kills ffmpeg children and
    # closes WS sessions).
    command: ["sh", "-c", "mkdir -p /config/db-backups && f=/config/db-backups/pre-migrate-$(date +%Y%m%d-%H%M%S).sql.gz && pg_dump --no-owner \"postgresql://hokago:${POSTGRES_PASSWORD}@postgres:5432/hokago\" | gzip > \"$$f\"; [ \"$$(wc -c < \"$$f\")\" -gt 100 ] || rm -f \"$$f\"; find /config/db-backups -name 'pre-migrate-*.sql.gz' -mtime +14 -delete; pnpm --filter @hokago/db run migrate:deploy && exec node apps/api/dist/index.js"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hokago:${POSTGRES_PASSWORD}@postgres:5432/hokago
      VALKEY_URL: redis://valkey:6379
      # Pinned to the bind mount below — code defaults to ./data/config
      # (cwd-relative), which inside a container is an empty overlay dir and
      # every artwork/avatar/font 404s. .env only supplies the host side.
      HOKAGO_CONFIG_DIR: /config
      # The SPA ships inside this image (infra/docker/Dockerfile runtime
      # stage) — when set, the API serves it and COOP/COEP become same-origin.
      HOKAGO_WEB_ROOT: /app/web
      PORT: 3000
    devices:
      # AMD/Intel GPU — mounted always, so hardware transcode is zero-config.
      # On a host without /dev/dri this just becomes an empty dir inside the
      # container and boot detection falls back to CPU (playback still works).
      - /dev/dri:/dev/dri
      # NVIDIA: needs nvidia-container-toolkit on the host, then uncomment:
      # gpus: all
    ports:
      - "${HOKAGO_PORT:-3000}:3000"
    healthcheck:
      # /health answers only after migrations + listen complete; node:22 has
      # a global fetch, so no curl dependency is needed in the runtime image.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ${HOKAGO_CONFIG_DIR}:/config
      # Media roots are first-class and plural — one line per Library, bound
      # at the fixed container path the Library's rootPath records (both API
      # and worker read media files). Sources come from .env; example.env
      # prefills ./data/media/* for a test drive.
      # NOTE: the ANIME mount must be `:rw` (not `:ro`) to enable the ani-cli
      # "Acquire from Internet" feature, which stages + imports files into the
      # library. Movies/TV can stay read-only.
      - ${MEDIA_MOVIES_PATH}:/media/movies:ro
      - ${MEDIA_TV_PATH}:/media/tv:ro
      # ANIME is :rw — the ani-cli "Acquire from Internet" feature stages +
      # imports files into the library (Movies/TV stay read-only).
      - ${MEDIA_ANIME_PATH}:/media/anime:rw

  hokago-worker:
    image: ghcr.io/rishabhroyy/hokago:${HOKAGO_VERSION:-latest}
    env_file:
      - .env
    command: ["sh", "-c", "exec node apps/worker/dist/index.js"]
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # The API runs migrations on boot — start after it so the worker's
      # boot reconciler never queries a schema that doesn't exist yet.
      hokago:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hokago:${POSTGRES_PASSWORD}@postgres:5432/hokago
      VALKEY_URL: redis://valkey:6379
      # Same as the API: artwork/fonts are written here and must land in the
      # shared bind mount, not the container overlay.
      HOKAGO_CONFIG_DIR: /config
    devices:
      # Mirror of the API's grant — the worker's ffmpeg jobs (art, trickplay,
      # downloads) use the same GPU.
      - /dev/dri:/dev/dri
      # NVIDIA: uncomment here too:
      # gpus: all
    volumes:
      - ${HOKAGO_CONFIG_DIR}:/config
      - ${MEDIA_MOVIES_PATH}:/media/movies:ro
      - ${MEDIA_TV_PATH}:/media/tv:ro
      # ANIME must be :rw for ani-cli acquisition (mirror of the API service).
      - ${MEDIA_ANIME_PATH}:/media/anime:rw
