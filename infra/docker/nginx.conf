# hokago web — serves the built SPA and reverse-proxies API paths to the
# `hokago` service. This is the production twin of the Vite dev proxy:
# keep the location list in sync with API_PATHS in apps/web/vite.config.ts.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # JASSUB depends on COOP/COEP being set on the document (and nothing
    # third-party is ever loaded, so require-corp is always satisfiable).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # WebSocket — watch state, admin console
    location /ws {
        proxy_pass http://hokago:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # API prefixes (see API_PATHS in apps/web/vite.config.ts)
    location /playback { proxy_pass http://hokago:3000; }
    location /media-files { proxy_pass http://hokago:3000; }
    location /fonts { proxy_pass http://hokago:3000; }
    location /artwork { proxy_pass http://hokago:3000; }
    location /avatars { proxy_pass http://hokago:3000; }
    location /health { proxy_pass http://hokago:3000; }
    location /auth { proxy_pass http://hokago:3000; }
    location /profiles { proxy_pass http://hokago:3000; }
    location /continue-watching { proxy_pass http://hokago:3000; }
    location /libraries { proxy_pass http://hokago:3000; }
    location /media-items { proxy_pass http://hokago:3000; }
    location /admin/queues { proxy_pass http://hokago:3000; }
    location /admin-api { proxy_pass http://hokago:3000; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
