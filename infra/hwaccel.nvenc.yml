# hokago — hardware acceleration overlay for NVIDIA GPUs (NVENC).
#
# Use: docker compose -f docker-compose.yml -f infra/hwaccel.nvenc.yml up -d
#      (or `pnpm docker:up:nvenc`)
#
# Prereqs on the host: NVIDIA driver + nvidia-container-toolkit (the `gpus:`
# compose key needs the toolkit's default runtime registered with Docker).
#
# What this does:
#   - `gpus: all` exposes every NVIDIA GPU to both ffmpeg-running services
#     (API transcodes + worker jobs) and injects the driver .so's — nothing
#     else is needed, the image itself ships no nvidia packages
#   - HOKAGO_HWACCEL=nvenc (auto-detection also picks nvenc when /dev/nvidia0
#     exists, but pinning it makes the intent explicit)
#   - HOKAGO_HWACCEL_DEVICE=0 picks the first card; a second GPU would be 1
#
# A broken driver or unsupported card falls back to CPU automatically
# (reportHwFailure) — playback always works.

services:
  hokago:
    gpus: all
    environment:
      HOKAGO_HWACCEL: ${HOKAGO_HWACCEL:-nvenc}
      HOKAGO_HWACCEL_DEVICE: ${HOKAGO_HWACCEL_DEVICE:-}

  hokago-worker:
    gpus: all
    environment:
      HOKAGO_HWACCEL: ${HOKAGO_HWACCEL:-nvenc}
      HOKAGO_HWACCEL_DEVICE: ${HOKAGO_HWACCEL_DEVICE:-}