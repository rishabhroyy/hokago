name: hokago
options:
  bundleIdPrefix: com.hokago
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  hokago:
    type: application
    platform: iOS
    sources:
      - hokago
    resources:
      - web-dist
      - path: hokago/Supporting/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hokago.app
        INFOPLIST_FILE: hokago/Supporting/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: hokago/Supporting/Info.plist
      properties:
        CFBundleDisplayName: hokago
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUserActivityTypes: []
        UIBackgroundModes: []
schemes:
  hokago:
    build:
      targets:
        hokago: all
    run:
      config: Debug
    archive:
      config: Release