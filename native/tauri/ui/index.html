<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hokago</title>
  <!-- The desktop shell's only local page: pick the server, then the webview
       navigates to it. Styled as the web app's login card (apps/web
       app.css .panel / .input / .btn-primary, dark-only) with system fonts —
       nothing is fetched before the server URL is known. -->
  <style>
    :root { color-scheme: dark; --ink: #F3F0EA; --ink-2: #C4BFB6; --ink-3: #948F86; --line: #2C2B28; --wii: #63C3E6; --accent: #F07B63; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--ink);
      background:
        radial-gradient(80% 70% at 95% -10%, rgba(79, 184, 224, 0.42), transparent 70%),
        radial-gradient(65% 60% at -5% 0%, rgba(240, 131, 111, 0.22), transparent 70%),
        radial-gradient(70% 60% at 100% 110%, rgba(240, 131, 111, 0.12), transparent 70%),
        radial-gradient(60% 55% at 0% 100%, rgba(79, 184, 224, 0.12), transparent 70%),
        linear-gradient(180deg, #1f2533 0%, #14161d 50%, #0b0c10 100%);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(rgba(143, 224, 245, 0.17) 1px, transparent 1.4px) 0 0 / 26px 26px;
      mask-image: linear-gradient(to bottom, #000, rgba(0, 0, 0, 0.25));
    }
    .card {
      position: relative; width: min(440px, 100%); padding: 36px 32px 30px; border-radius: 32px; text-align: center;
      background: rgba(43, 39, 34, 0.88); border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.06), 0 2px 6px -2px rgba(0,0,0,0.45), 0 18px 44px -18px rgba(0,0,0,0.65);
      backdrop-filter: blur(10px);
      animation: zoomin .42s cubic-bezier(.4,0,.2,1);
    }
    @keyframes zoomin { from { opacity: 0; transform: scale(.94); } }
    .mark { width: 60px; height: auto; margin-bottom: 18px; }
    h1 { font-family: "Zen Maru Gothic", ui-rounded, system-ui, sans-serif; font-size: 28px; line-height: 1.15; letter-spacing: -0.01em; font-weight: 700; margin-bottom: 8px; }
    p { color: var(--ink-2); font-size: 14.5px; line-height: 1.6; margin-bottom: 24px; }
    code { background: #1B1A18; padding: .1em .45em; border-radius: 6px; color: var(--ink); font-size: 13px; }
    form { display: flex; flex-direction: column; gap: 14px; align-items: center; }
    input {
      width: 100%; height: 48px; border-radius: 999px; border: 1.5px solid var(--line); background: #1B1A18;
      padding: 0 20px; font: inherit; font-size: 14.5px; color: var(--ink); outline: none; text-align: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.35); transition: border-color .15s ease, box-shadow .15s ease;
    }
    input::placeholder { color: var(--ink-3); }
    input:focus { border-color: var(--wii); box-shadow: inset 0 2px 4px rgba(0,0,0,0.35), 0 0 0 3.5px rgba(99,195,230,0.28); }
    button {
      position: relative; overflow: hidden; border: none; cursor: pointer; margin-top: 6px;
      border-radius: 999px; padding: 13px 34px; font: inherit; font-size: 14.5px; font-weight: 700; color: #fff;
      background: linear-gradient(180deg, #45ADDD, #187AA5);
      box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.45), 0 6px 18px -6px rgba(46,155,196,0.65);
      text-shadow: 0 1px 2px rgba(23,122,158,0.4);
      transition: transform .15s cubic-bezier(.4,1.4,.5,1), box-shadow .2s ease;
    }
    button::after {
      content: ""; position: absolute; top: 0; left: 6%; right: 6%; height: 46%;
      border-radius: 100px 100px 60% 60% / 100% 100% 34% 34%;
      background: linear-gradient(rgba(255, 255, 255, 0.5), transparent); pointer-events: none;
    }
    button:hover { transform: translateY(-2px); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.45), 0 4px 24px -2px rgba(79,184,224,0.8), 0 0 0 3px rgba(18,17,16,0.9), 0 0 0 5px rgba(79,184,224,0.5); }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 2.5px solid #4FB8E0; outline-offset: 3px; }
    .error { color: var(--accent); font-size: 13px; font-weight: 600; min-height: 1.25em; }
    .hint { color: var(--ink-3); font-size: 12px; line-height: 1.5; margin-top: 4px; }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } button { transition: none; } }
  </style>
</head>

    <h1>Connect to your server</h1>
    <p>Enter the address of your hokago server — e.g. <code>192.168.1.20:3000</code> or your remote address.</p>
    <form id="form">
      <input id="url" type="url" placeholder="https://hokago.example.com" autocomplete="off" spellcheck="false" autofocus />
      <button type="submit">Connect</button>
      <div class="error" id="error"></div>
      <div class="hint">Saved on this device only. If the server can't be reached, the app opens its built-in copy of hokago for your downloads.</div>
    </form>
  </div>

  <script>
    const inv = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke
      ? window.__TAURI_INTERNALS__.invoke.bind(window.__TAURI_INTERNALS__)
      : null;

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const el = document.getElementById('url');
      const err = document.getElementById('error');
      err.textContent = '';
      let url = el.value.trim();
      if (!url) { err.textContent = 'Enter a server URL.'; return; }
      if (!/^https?:\/\//i.test(url)) url = 'http://' + url;
      try {
        if (inv) await inv('save_server_url', { url });
        location.href = url;
      } catch (err2) {
        err.textContent = 'Could not save the server URL: ' + String(err2);
      }
    });

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        if (inv) {
          const saved = await inv('get_server_url');
          if (saved) {
            const w = new URL(saved);
            document.getElementById('url').value = w.host + w.pathname.replace(/\/$/, '');
            // Auto-launch: try the remote server; if it's unreachable, load
            // the bundled SPA (offline mode) instead of sitting on this form.
            // The probe runs Rust-side — a webview fetch would be cross-origin
            // and CORS-blocked, so it could never tell "up" from "down".
            const up = await inv('probe_server', { url: saved });
            if (up) location.href = saved;
            else location.href = 'hokago-spa://localhost/';
          }
        }
      } catch (e) { /* first run */ }
    });
  </script>
